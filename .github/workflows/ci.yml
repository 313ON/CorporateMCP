name: System Inspector CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run authoritative tests
        run: uv run python -m unittest discover -s tests -v

      - name: Compile and import verification
        run: |
          uv run python -m compileall -q src tests scripts
          uv run python -c "import corporate_mcp_system_inspector.server"

      - name: Verify MCP tool surface
        run: uv run python scripts/verify_mcp_surface.py

      - name: Verify forbidden capability boundary
        run: uv run python scripts/verify_security_boundary.py

      - name: Verify package build
        run: uv build
